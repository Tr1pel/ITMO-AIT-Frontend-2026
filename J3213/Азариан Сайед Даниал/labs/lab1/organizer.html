<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventPass - Кабинет организатора</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">EventPass</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#organizerNav" aria-controls="organizerNav" aria-expanded="false" aria-label="Переключить навигацию">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="organizerNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="organizer.html">Кабинет организатора</a></li>
          </ul>
          <a class="btn btn-outline-primary" href="auth.html" id="organizerLogoutBtn">Выйти</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="cabinet-page py-4 py-lg-5">
    <div class="container">
      <section class="cabinet-card p-3 p-sm-4 mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
          <div>
            <h1 class="h4 m-0">Личный кабинет организатора</h1>
            <p class="text-secondary m-0 small" id="organizerIdentity">Организатор</p>
          </div>
          <div id="organizerMessage"></div>
        </div>
      </section>

      <div class="row g-4">
        <div class="col-xl-5">
          <section class="cabinet-card p-3 p-sm-4">
            <h2 class="h5 mb-3">Создание события</h2>
            <form id="createEventForm" class="needs-validation" novalidate>
              <div class="mb-3">
                <label class="form-label" for="eventNameInput">Название</label>
                <input class="form-control" id="eventNameInput" required minlength="3" placeholder="Например, Summer Indie Fest">
                <div class="invalid-feedback">Введите название события.</div>
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="eventCategoryInput">Категория</label>
                  <select class="form-select" id="eventCategoryInput" required>
                    <option value="">Выберите</option>
                    <option>Концерт</option>
                    <option>Театр</option>
                    <option>Спорт</option>
                    <option>Шоу</option>
                    <option>Лекция</option>
                  </select>
                  <div class="invalid-feedback">Выберите категорию.</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="eventDateInput">Дата</label>
                  <input class="form-control" type="date" id="eventDateInput" required>
                  <div class="invalid-feedback">Укажите дату.</div>
                </div>
              </div>
              <div class="row g-3 mt-0">
                <div class="col-md-6">
                  <label class="form-label" for="eventCityInput">Город</label>
                  <input class="form-control" id="eventCityInput" required placeholder="Москва">
                  <div class="invalid-feedback">Укажите город.</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="eventVenueInput">Площадка</label>
                  <input class="form-control" id="eventVenueInput" required placeholder="VK Stadium">
                  <div class="invalid-feedback">Укажите площадку.</div>
                </div>
              </div>
              <div class="row g-3 mt-0">
                <div class="col-md-6">
                  <label class="form-label" for="eventPriceInput">Цена билета, ₽</label>
                  <input class="form-control" type="number" min="1" id="eventPriceInput" required>
                  <div class="invalid-feedback">Укажите цену билета.</div>
                </div>
              </div>
              <button class="btn btn-primary w-100 mt-4" type="submit">Создать событие</button>
            </form>
          </section>
        </div>

        <div class="col-xl-7">
          <section class="cabinet-card p-3 p-sm-4">
            <div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
              <h2 class="h5 m-0">Список событий</h2>
            </div>
            <div id="organizerEventsList" class="d-grid gap-3"></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script src="script.js"></script>
</body>
</html>
